name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Dependency / supply-chain scanning + SBOMs (DESIGN.md §19.6, §21 Phase 5).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Python: audit installed dependencies against the advisory DB.
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit cyclonedx-bom
          pip-audit --strict
          cyclonedx-py environment -o ../sbom-backend.json

      # Node: audit production dependencies (high+), then SBOM.
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file ../sbom-frontend.json

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: sbom-*.json
          if-no-files-found: ignore
